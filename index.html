<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CandyWebGL - 主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background: #0a0a0f;
            color: #e6e6e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 动态背景 */
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(255, 45, 100, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(123, 45, 255, 0.1) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        @keyframes bgPulse { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }

        /* 网格背景 */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 25s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(60px); }
        }

        /* 浮动粒子 */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatUp 20s infinite;
        }
        @keyframes floatUp {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* 炫酷标题 */
        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .header h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .header h1 span {
            background: linear-gradient(90deg, #ff2d64, #00d4ff, #7b2dff, #ff2d64);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientFlow 5s linear infinite;
        }

        .header h1::before {
            content: '🎨 CandyWebGL';
            position: absolute;
            top: 3px; left: 3px;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #ff2d64, #00d4ff, #7b2dff, #ff2d64);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientFlow 5s linear infinite;
            filter: blur(15px);
            opacity: 0.6;
        }

        @keyframes gradientFlow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.3rem;
            letter-spacing: 0.3em;
            animation: subtitlePulse 3s ease-in-out infinite;
        }
        @keyframes subtitlePulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.8; } }

        /* 3D导航卡片容器 */
        .nav-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
            max-width: 1000px;
            perspective: 1500px;
        }

        /* 3D导航卡片 */
        .nav-card {
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.9), rgba(30, 30, 50, 0.8));
            border-radius: 25px;
            padding: 60px 50px;
            text-align: center;
            text-decoration: none;
            min-width: 350px;
            position: relative;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            overflow: hidden;
        }

        /* 霓虹边框效果 */
        .nav-card::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 28px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .nav-card.main-function::before {
            background: linear-gradient(45deg, #ff2d64, #ff6b35, #ff2d64, #ff6b35);
            background-size: 400% 400%;
            animation: borderGlow 6s linear infinite;
        }

        .nav-card.study::before {
            background: linear-gradient(45deg, #00d4ff, #7b2dff, #00d4ff, #7b2dff);
            background-size: 400% 400%;
            animation: borderGlow 6s linear infinite;
        }

        @keyframes borderGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .nav-card:hover::before { opacity: 1; }

        /* 卡片内部光效 */
        .nav-card::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.8s;
            z-index: 1;
        }
        .nav-card:hover::after { left: 150%; }

        .nav-card:hover {
            transform: translateY(-20px) rotateX(10deg) rotateY(-5deg) scale(1.05);
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(255, 45, 100, 0.3),
                0 0 100px rgba(255, 45, 100, 0.15);
        }

        .nav-card.study:hover {
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(0, 212, 255, 0.3),
                0 0 100px rgba(0, 212, 255, 0.15);
        }

        /* 图标动画 */
        .nav-icon {
            font-size: 5rem;
            margin-bottom: 25px;
            display: inline-block;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            position: relative;
            z-index: 2;
        }
        .nav-card:hover .nav-icon {
            transform: rotateY(360deg) scale(1.3);
        }

        /* 标题 */
        .nav-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 0.1em;
            position: relative;
            z-index: 2;
            transition: all 0.3s;
        }
        .nav-card.main-function .nav-title { color: #ff2d64; }
        .nav-card.study .nav-title { color: #00d4ff; }
        .nav-card:hover .nav-title {
            transform: translateX(15px);
            filter: brightness(1.3);
        }

        /* 描述 */
        .nav-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            line-height: 1.8;
            position: relative;
            z-index: 2;
            transition: color 0.3s;
        }
        .nav-card:hover .nav-desc { color: rgba(255, 255, 255, 0.85); }

        /* 底部 */
        .footer {
            margin-top: 80px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -30px; left: 50%;
            transform: translateX(-50%);
            width: 300px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header h1 { font-size: 2.5rem; }
            .nav-container { gap: 30px; }
            .nav-card { min-width: 100%; padding: 40px 30px; }
            .nav-card:hover { transform: translateY(-15px) scale(1.02); }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="header">
        <h1><span>🎨 CandyWebGL</span></h1>
        <p>WebGL 三维图形与可视化项目</p>
    </div>

    <div class="nav-container">
        <a href="MainFunction/导航.html" class="nav-card main-function">
            <div class="nav-icon">🚀</div>
            <div class="nav-title">主要功能</div>
            <div class="nav-desc">模型加载器、CAD工具、3D可视化、图形API、实验项目、图元编辑等所有功能合集</div>
        </a>

        <a href="study/导航.html" class="nav-card study">
            <div class="nav-icon">📚</div>
            <div class="nav-title">学习教程</div>
            <div class="nav-desc">WebGL从基础到进阶的系统学习教程，涵盖2D图形、3D变换、光照与场景</div>
        </a>
    </div>

    <div class="footer">
        <p>CandyWebGL 项目主页</p>
    </div>

    <script>
        // 创建浮动粒子
        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#ff2d64', '#00d4ff', '#7b2dff', '#ff6b35'];
            
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 15) + 's';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.width = (3 + Math.random() * 5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.boxShadow = `0 0 ${15 + Math.random() * 15}px ${particle.style.background}`;
                container.appendChild(particle);
            }
        }

        // 3D卡片鼠标跟随效果
        document.querySelectorAll('.nav-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = (y - centerY) / 15;
                const rotateY = (centerX - x) / 15;
                
                card.style.transform = `translateY(-20px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0) rotateX(0) rotateY(0) scale(1)';
            });
        });

        createParticles();
    </script>
</body>
</html>
