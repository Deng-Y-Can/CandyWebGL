<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CandyWebGL - 主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 60px;
    }

    .header h1 {
      color: #e94560;
      font-size: 3em;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .header p {
      color: #a0a0a0;
      font-size: 1.2em;
    }

    .nav-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      max-width: 900px;
    }

    .nav-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      text-decoration: none;
      transition: all 0.3s ease;
      min-width: 300px;
      backdrop-filter: blur(10px);
    }

    .nav-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .nav-card.main-function {
      border-color: rgba(233, 69, 96, 0.3);
    }

    .nav-card.main-function:hover {
      border-color: rgba(233, 69, 96, 0.8);
    }

    .nav-card.study {
      border-color: rgba(157, 78, 221, 0.3);
    }

    .nav-card.study:hover {
      border-color: rgba(157, 78, 221, 0.8);
    }

    .nav-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }

    .nav-title {
      font-size: 1.8em;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .nav-card.main-function .nav-title {
      color: #e94560;
    }

    .nav-card.study .nav-title {
      color: #9d4edd;
    }

    .nav-desc {
      color: #a0a0a0;
      font-size: 1em;
      line-height: 1.6;
    }

    .footer {
      margin-top: 60px;
      color: #666;
      font-size: 0.9em;
      text-align: center;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2em;
      }

      .nav-card {
        min-width: 100%;
        padding: 40px 30px;
      }

      .nav-container {
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>🎨 CandyWebGL</h1>
    <p>WebGL 三维图形与可视化项目</p>
  </div>

  <div class="nav-container">
    <a href="MainFunction/导航.html" class="nav-card main-function">
      <div class="nav-icon">🚀</div>
      <div class="nav-title">主要功能</div>
      <div class="nav-desc">模型加载器、CAD工具、3D可视化、图形API、实验项目、图元编辑等所有功能合集</div>
    </a>

    <a href="study/导航.html" class="nav-card study">
      <div class="nav-icon">📚</div>
      <div class="nav-title">学习教程</div>
      <div class="nav-desc">WebGL从基础到进阶的系统学习教程，涵盖2D图形、3D变换、光照与场景</div>
    </a>
  </div>

  <div class="footer">
    <p>CandyWebGL 项目主页</p>
  </div>
</body>

</html>
