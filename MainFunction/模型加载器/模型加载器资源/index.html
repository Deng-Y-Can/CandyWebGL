<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Model Viewer - 多格式导入导出 / 流畅操作</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #0a0e14;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
            color: #e5e7eb;
            touch-action: none;
            user-select: none;
        }

        #wrap {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
        }

        #c {
            flex: 1;
            display: block;
            background: radial-gradient(ellipse at center, #1a1f2e 0%, #0a0e14 100%);
            cursor: grab;
        }

        #c:active {
            cursor: grabbing;
        }

        .ui {
            position: absolute;
            left: 12px;
            top: 12px;
            background: rgba(12,16,22,.92);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;
            padding: 14px 14px;
            color: rgba(255,255,255,.92);
            backdrop-filter: blur(16px);
            min-width: 360px;
            max-width: 420px;
            box-shadow: 0 12px 40px rgba(0,0,0,.4);
            user-select: none;
            overflow-y: auto;
            max-height: calc(100vh - 32px);
        }

        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .ui-title {
            font-weight: 600;
            font-size: 14px;
            color: #60a5fa;
        }

        .ui-actions {
            display: flex;
            gap: 6px;
        }

        .btn {
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 8px;
            color: rgba(255,255,255,.92);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn:hover {
            background: rgba(255,255,255,.1);
            border-color: rgba(255,255,255,.2);
        }

        .btn.primary {
            background: rgba(60,140,255,.25);
            border-color: rgba(60,140,255,.4);
            color: #93c5fd;
        }

        .btn.primary:hover {
            background: rgba(60,140,255,.35);
        }

        .btn.danger {
            background: rgba(255,90,90,.18);
            border-color: rgba(255,90,90,.28);
            color: #fca5a5;
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn.sm {
            padding: 4px 8px;
            font-size: 11px;
        }

        .section {
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .row > label {
            width: 80px;
            opacity: .8;
            font-size: 12px;
        }

        .row.flex-end {
            justify-content: flex-end;
        }

        .row.full-width {
            flex-wrap: nowrap;
        }

        .row.full-width input[type="file"] {
            flex: 1;
        }

        input[type="file"] {
            color: rgba(255,255,255,.8);
            font-size: 12px;
        }

        select, input[type="range"], input[type="number"] {
            background: rgba(255,255,255,.05);
            color: rgba(255,255,255,.92);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 8px;
            padding: 7px 10px;
            outline: none;
            font-size: 12px;
            transition: border-color 0.15s;
        }

        select:focus, input[type="range"]:focus, input[type="number"]:focus {
            border-color: rgba(60,140,255,.5);
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #3b82f6;
        }

        .range-value {
            font-size: 12px;
            opacity: .7;
            min-width: 40px;
            text-align: right;
        }

        .color-picker {
            width: 40px;
            height: 30px;
            padding: 2px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .sep {
            height: 1px;
            background: rgba(255,255,255,.06);
            margin: 12px 0;
        }

        .stats {
            font-size: 11px;
            opacity: .75;
            line-height: 1.5;
            background: rgba(255,255,255,.03);
            border-radius: 8px;
            padding: 8px 10px;
        }

        .stats div {
            margin-bottom: 4px;
        }

        .stats div:last-child {
            margin-bottom: 0;
        }

        .hint {
            font-size: 11px;
            opacity: .65;
            line-height: 1.4;
            margin-top: 8px;
        }

        .measure-list {
            max-height: 100px;
            overflow: auto;
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 8px;
            padding: 6px;
            background: rgba(255,255,255,.02);
            font-size: 11px;
        }

        .measure-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            border-bottom: 1px dashed rgba(255,255,255,.06);
        }

        .measure-item:last-child {
            border-bottom: none;
        }

        .toast {
            position: absolute;
            right: 16px;
            top: 16px;
            background: rgba(20,26,36,.95);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: rgba(255,255,255,.92);
            max-width: 400px;
            line-height: 1.4;
            box-shadow: 0 8px 30px rgba(0,0,0,.35);
            display: none;
            white-space: pre-wrap;
            z-index: 100;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .model-info {
            font-size: 11px;
            background: rgba(60,140,255,.1);
            border: 1px solid rgba(60,140,255,.2);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 12px;
        }

        .model-info .name {
            font-weight: 600;
            color: #93c5fd;
            margin-bottom: 4px;
        }

        .model-info .props {
            display: flex;
            gap: 12px;
            opacity: .7;
        }

        .progress-bar {
            height: 3px;
            background: rgba(255,255,255,.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 2px;
            transition: width 0.15s ease-out;
        }

        .transform-panel {
            background: rgba(255,255,255,.03);
            border-radius: 8px;
            padding: 10px;
        }

        .transform-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }

        .transform-label {
            width: 40px;
            font-size: 11px;
            opacity: .6;
        }

        .transform-input {
            flex: 1;
            width: 60px;
        }

        .export-menu {
            position: absolute;
            background: rgba(12,16,22,.95);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 8px;
            padding: 4px;
            display: none;
            z-index: 101;
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
        }

        .export-menu.show {
            display: block;
        }

        .export-option {
            padding: 8px 24px 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.15s;
        }

        .export-option:hover {
            background: rgba(255,255,255,.1);
        }

        .view-controls {
            position: absolute;
            right: 16px;
            bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .view-btn {
            width: 36px;
            height: 36px;
            background: rgba(12,16,22,.85);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: rgba(255,255,255,.8);
            font-size: 12px;
            font-weight: 600;
            transition: all 0.15s;
        }

        .view-btn:hover {
            background: rgba(60,140,255,.2);
            border-color: rgba(60,140,255,.3);
            color: #93c5fd;
        }

        .status-bar {
            position: absolute;
            bottom: 12px;
            left: 400px;
            font-size: 11px;
            opacity: .6;
            color: #9ca3af;
            display: flex;
            gap: 16px;
        }

        .fps-counter {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .fps-value {
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <canvas id="c"></canvas>

        <div class="ui" id="uiPanel">
            <div class="ui-header">
                <div class="ui-title">3D 模型查看器</div>
                <div class="ui-actions">
                    <button class="btn" id="btnScreenshot" title="截图">📷</button>
                    <div class="export-container" id="exportContainer">
                        <button class="btn" id="btnExport" title="导出模型">📥</button>
                        <div class="export-menu" id="exportMenu">
                            <div class="export-option" data-format="ply">导出 PLY</div>
                            <div class="export-option" data-format="stl">导出 STL</div>
                            <div class="export-option" data-format="obj">导出 OBJ</div>
                        </div>
                    </div>
                    <button class="btn" id="btnClear" title="清空模型">🗑️</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">导入模型</div>
                <div class="row full-width">
                    <input id="file" type="file" accept=".ply,.obj,.stl,.gltf,.glb,.fbx" multiple />
                </div>
                <div class="row">
                    <button id="btnDemo" class="btn primary">加载示例模型</button>
                    <input id="urlInput" type="text" placeholder="或输入模型URL" style="flex:1; font-size:12px; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:#e5e7eb;" />
                    <button id="btnLoadUrl" class="btn">加载</button>
                </div>
                <div id="modelInfo" class="model-info" style="display:none;">
                    <div class="name" id="modelName">-</div>
                    <div class="props" id="modelProps"></div>
                </div>
                <div id="progressBar" class="progress-bar" style="display:none;">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="sep"></div>

            <div class="section">
                <div class="section-title">显示设置</div>
                <div class="row">
                    <label>显示模式</label>
                    <select id="viewMode">
                        <option value="auto" selected>自动</option>
                        <option value="points">点云</option>
                        <option value="triangles">网格</option>
                    </select>
                </div>
                <div class="row">
                    <label>点大小</label>
                    <input id="pointSize" type="range" min="1" max="20" step="0.5" value="3" />
                    <span class="range-value" id="pointSizeVal">3.0</span>
                </div>
                <div class="row">
                    <label>颜色</label>
                    <input id="modelColor" type="color" value="#ffffff" class="color-picker" />
                    <label style="width:auto;">
                        <input id="fakeLight" type="checkbox" checked />
                        <span style="font-size:11px; opacity:.75;">假光照</span>
                    </label>
                </div>
                <div class="row">
                    <label>背景</label>
                    <select id="bgMode">
                        <option value="gradient" selected>渐变</option>
                        <option value="solid">纯色</option>
                        <option value="grid">网格</option>
                    </select>
                    <input id="bgColor" type="color" value="#0a0e14" class="color-picker" />
                </div>
            </div>

            <div class="sep"></div>

            <div class="section">
                <div class="section-title">沿轴染色</div>
                <div class="row">
                    <label>轴向</label>
                    <select id="axisColor">
                        <option value="none" selected>无</option>
                        <option value="x">X 轴</option>
                        <option value="y">Y 轴</option>
                        <option value="z">Z 轴</option>
                    </select>
                    <button id="btnApplyAxis" class="btn">应用</button>
                </div>
            </div>

            <div class="sep"></div>

            <div class="section">
                <div class="section-title">变换</div>
                <div class="transform-panel">
                    <div class="transform-row">
                        <span class="transform-label">位置</span>
                        <input type="number" class="transform-input" id="posX" value="0" step="0.1" />
                        <input type="number" class="transform-input" id="posY" value="0" step="0.1" />
                        <input type="number" class="transform-input" id="posZ" value="0" step="0.1" />
                    </div>
                    <div class="transform-row">
                        <span class="transform-label">缩放</span>
                        <input type="number" class="transform-input" id="scaleX" value="1" step="0.1" />
                        <input type="number" class="transform-input" id="scaleY" value="1" step="0.1" />
                        <input type="number" class="transform-input" id="scaleZ" value="1" step="0.1" />
                    </div>
                </div>
                <div class="row flex-end" style="margin-top:8px;">
                    <button id="btnResetTransform" class="btn sm">重置变换</button>
                    <button id="btnCenter" class="btn sm primary">居中</button>
                </div>
            </div>

            <div class="sep"></div>

            <div class="section">
                <div class="section-title">测量工具</div>
                <div class="row">
                    <button id="btnMeasure" class="btn" style="flex:1;">开启测量</button>
                    <button id="btnClearMeasure" class="btn danger">清空</button>
                </div>
                <div class="measure-list" id="measureList">
                    <div style="opacity:.6; text-align:center;">暂无测量</div>
                </div>
            </div>

            <div class="sep"></div>

            <div class="stats" id="stats">
                <div>模型：未加载</div>
                <div>顶点：-</div>
                <div>三角形：-</div>
                <div>包围盒：-</div>
            </div>

            <div class="hint">
                <strong>操作提示：</strong>
                <br>• 左键拖动：旋转视角
                <br>• 右键拖动 / Shift+左键：平移
                <br>• 滚轮：缩放
                <br>• 测量模式：点击两点生成测量线
            </div>
        </div>

        <div class="view-controls">
            <button class="view-btn" id="btnViewFront" title="前视图">前</button>
            <button class="view-btn" id="btnViewBack" title="后视图">后</button>
            <button class="view-btn" id="btnViewLeft" title="左视图">左</button>
            <button class="view-btn" id="btnViewRight" title="右视图">右</button>
            <button class="view-btn" id="btnViewTop" title="俯视图">俯</button>
            <button class="view-btn" id="btnViewBottom" title="仰视图">仰</button>
        </div>

        <div class="status-bar">
            <div class="fps-counter">
                <span>FPS:</span>
                <span class="fps-value" id="fpsValue">60</span>
            </div>
            <div id="renderStats">三角形: 0</div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script type="module">
        import { vec3, vec4, mat3, mat4, mathf } from "./math-gl.js";
        import { GLDevice, Renderer, Scene, Program, Mesh, Material, Model, Texture2D } from "./webgl-runtime.js";
        import { parsePLY } from "./ply-importer.js";
        import { parseOBJ } from "./obj-importer.js";
        import { parseSTL } from "./stl-importer.js";
        import { parseGLTF } from "./gltf-importer.js";
        import { parseFBX } from "./fbx-importer.js";

        const toastEl = document.getElementById("toast");
        let toastTimer = null;
        function toast(msg, ms = 2500) {
            toastEl.textContent = msg;
            toastEl.style.display = "block";
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.style.display = "none", ms);
        }

        class BasicCamera {
            constructor() {
                this.projectionMatrix = mat4.create();
                this.viewMatrix = mat4.create();
                this.viewProjectionMatrix = mat4.create();
                this.eye = vec3.fromValues(0, 0, 3);
                this.target = vec3.fromValues(0, 0, 0);
                this.up = vec3.fromValues(0, 1, 0);
                this.fovY = mathf.degToRad(60);
                this.near = 0.01;
                this.far = 5000;
                this.aspect = 1;
                this._dirty = true;
            }
            setPerspective(fovY, aspect, near, far) {
                this.fovY = fovY;
                this.aspect = aspect;
                this.near = near;
                this.far = far;
                this._dirty = true;
            }
            lookAt(eye, target, up) {
                vec3.copy(this.eye, eye);
                vec3.copy(this.target, target);
                vec3.copy(this.up, up);
                this._dirty = true;
            }
            updateMatrices() {
                if (!this._dirty) return;
                mat4.perspective(this.projectionMatrix, this.fovY, this.aspect, this.near, this.far);
                mat4.lookAt(this.viewMatrix, this.eye, this.target, this.up);
                mat4.mul(this.viewProjectionMatrix, this.projectionMatrix, this.viewMatrix);
                this._dirty = false;
            }
        }

        class OrbitControls {
            constructor(canvas, camera) {
                this.canvas = canvas;
                this.camera = camera;
                this.target = vec3.fromValues(0, 0, 0);
                this.distance = 3.0;
                this.yaw = 0.0;
                this.pitch = 0.0;
                this._drag = false;
                this._mode = "rotate";
                this._lastX = 0;
                this._lastY = 0;
                this.minDistance = 0.05;
                this.maxDistance = 1e6;
                this._velocity = vec3.fromValues(0, 0, 0);
                this._damping = 0.92;
                this._enableDamping = true;
                this._bind();
                this.updateCamera();
            }
            setFromBounds(bbox) {
                const c = vec3.fromValues(
                    (bbox.min[0] + bbox.max[0]) * 0.5,
                    (bbox.min[1] + bbox.max[1]) * 0.5,
                    (bbox.min[2] + bbox.max[2]) * 0.5
                );
                vec3.copy(this.target, c);
                const dx = bbox.max[0] - bbox.min[0];
                const dy = bbox.max[1] - bbox.min[1];
                const dz = bbox.max[2] - bbox.min[2];
                const diag = Math.max(1e-6, Math.hypot(dx, dy, dz));
                this.distance = diag * 2;
                this.yaw = Math.PI * 0.25;
                this.pitch = Math.PI * 0.12;
                this._velocity = vec3.fromValues(0, 0, 0);
                this.updateCamera();
            }
            setView(viewType) {
                const dist = this.distance;
                this.yaw = 0;
                this.pitch = 0;
                switch (viewType) {
                    case "front": this.yaw = 0; this.pitch = 0; break;
                    case "back": this.yaw = Math.PI; this.pitch = 0; break;
                    case "left": this.yaw = Math.PI / 2; this.pitch = 0; break;
                    case "right": this.yaw = -Math.PI / 2; this.pitch = 0; break;
                    case "top": this.yaw = 0; this.pitch = -Math.PI / 2; break;
                    case "bottom": this.yaw = 0; this.pitch = Math.PI / 2; break;
                }
                this.distance = dist;
                this.updateCamera();
            }
            _bind() {
                this.canvas.addEventListener("contextmenu", e => e.preventDefault());
                let lastTouchDistance = 0;
                let lastTouchCenterX = 0;
                let lastTouchCenterY = 0;
                this.canvas.addEventListener("pointerdown", e => {
                    this._drag = true;
                    this._lastX = e.clientX;
                    this._lastY = e.clientY;
                    const isPan = (e.button === 2) || (e.button === 0 && e.shiftKey);
                    this._mode = isPan ? "pan" : "rotate";
                    this._velocity = vec3.fromValues(0, 0, 0);
                });
                window.addEventListener("pointerup", () => { this._drag = false; });
                window.addEventListener("pointermove", e => {
                    if (!this._drag) return;
                    const dx = e.clientX - this._lastX;
                    const dy = e.clientY - this._lastY;
                    this._lastX = e.clientX;
                    this._lastY = e.clientY;
                    if (this._mode === "rotate") {
                        const rotSpeed = 0.005;
                        this.yaw -= dx * rotSpeed;
                        this.pitch -= dy * rotSpeed;
                        const lim = Math.PI / 2 - 0.01;
                        this.pitch = Math.max(-lim, Math.min(lim, this.pitch));
                        this._velocity[0] = -dx * rotSpeed;
                        this._velocity[1] = -dy * rotSpeed;
                    } else {
                        const panSpeed = this.distance * 0.0012;
                        const dir = this._getDir();
                        const right = vec3.create();
                        vec3.cross(right, dir, vec3.fromValues(0, 1, 0));
                        const rl = Math.hypot(right[0], right[1], right[2]);
                        if (rl > 1e-6) { right[0] /= rl; right[1] /= rl; right[2] /= rl; }
                        const up = vec3.create();
                        vec3.cross(up, right, dir);
                        const ul = Math.hypot(up[0], up[1], up[2]);
                        if (ul > 1e-6) { up[0] /= ul; up[1] /= ul; up[2] /= ul; }
                        this.target[0] += (-dx * panSpeed) * right[0] + (dy * panSpeed) * up[0];
                        this.target[1] += (-dx * panSpeed) * right[1] + (dy * panSpeed) * up[1];
                        this.target[2] += (-dx * panSpeed) * right[2] + (dy * panSpeed) * up[2];
                    }
                    this.updateCamera();
                });
                this.canvas.addEventListener("wheel", e => {
                    e.preventDefault();
                    const s = Math.exp(e.deltaY * 0.001);
                    this.distance *= s;
                    this.distance = Math.max(this.minDistance, Math.min(this.maxDistance, this.distance));
                    this.updateCamera();
                }, { passive: false });
                this.canvas.addEventListener("touchstart", e => {
                    if (e.touches.length === 2) {
                        const t1 = e.touches[0], t2 = e.touches[1];
                        lastTouchDistance = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                        lastTouchCenterX = (t1.clientX + t2.clientX) / 2;
                        lastTouchCenterY = (t1.clientY + t2.clientY) / 2;
                    }
                }, { passive: true });
                this.canvas.addEventListener("touchmove", e => {
                    if (e.touches.length === 2) {
                        e.preventDefault();
                        const t1 = e.touches[0], t2 = e.touches[1];
                        const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                        const scale = dist / lastTouchDistance;
                        this.distance /= scale;
                        this.distance = Math.max(this.minDistance, Math.min(this.maxDistance, this.distance));
                        const centerX = (t1.clientX + t2.clientX) / 2;
                        const centerY = (t1.clientY + t2.clientY) / 2;
                        const dx = centerX - lastTouchCenterX;
                        const dy = centerY - lastTouchCenterY;
                        const panSpeed = this.distance * 0.0008;
                        const dir = this._getDir();
                        const right = vec3.create();
                        vec3.cross(right, dir, vec3.fromValues(0, 1, 0));
                        const rl = Math.hypot(right[0], right[1], right[2]);
                        if (rl > 1e-6) { right[0] /= rl; right[1] /= rl; right[2] /= rl; }
                        const up = vec3.create();
                        vec3.cross(up, right, dir);
                        const ul = Math.hypot(up[0], up[1], up[2]);
                        if (ul > 1e-6) { up[0] /= ul; up[1] /= ul; up[2] /= ul; }
                        this.target[0] += (-dx * panSpeed) * right[0] + (dy * panSpeed) * up[0];
                        this.target[1] += (-dx * panSpeed) * right[1] + (dy * panSpeed) * up[1];
                        this.target[2] += (-dx * panSpeed) * right[2] + (dy * panSpeed) * up[2];
                        lastTouchDistance = dist;
                        lastTouchCenterX = centerX;
                        lastTouchCenterY = centerY;
                        this.updateCamera();
                    }
                }, { passive: false });
            }
            _getDir() {
                const cp = Math.cos(this.pitch);
                const sp = Math.sin(this.pitch);
                const cy = Math.cos(this.yaw);
                const sy = Math.sin(this.yaw);
                const ex = this.target[0] + this.distance * (cp * sy);
                const ey = this.target[1] + this.distance * (sp);
                const ez = this.target[2] + this.distance * (cp * cy);
                const dir = vec3.fromValues(this.target[0] - ex, this.target[1] - ey, this.target[2] - ez);
                const l = Math.hypot(dir[0], dir[1], dir[2]) || 1;
                dir[0] /= l; dir[1] /= l; dir[2] /= l;
                return dir;
            }
            updateCamera() {
                const cp = Math.cos(this.pitch);
                const sp = Math.sin(this.pitch);
                const cy = Math.cos(this.yaw);
                const sy = Math.sin(this.yaw);
                const eye = vec3.fromValues(
                    this.target[0] + this.distance * (cp * sy),
                    this.target[1] + this.distance * (sp),
                    this.target[2] + this.distance * (cp * cy)
                );
                this.camera.lookAt(eye, this.target, vec3.fromValues(0, 1, 0));
            }
            update() {
                if (!this._drag && this._enableDamping && (Math.abs(this._velocity[0]) > 1e-5 || Math.abs(this._velocity[1]) > 1e-5)) {
                    this.yaw += this._velocity[0];
                    this.pitch += this._velocity[1];
                    const lim = Math.PI / 2 - 0.01;
                    this.pitch = Math.max(-lim, Math.min(lim, this.pitch));
                    this._velocity[0] *= this._damping;
                    this._velocity[1] *= this._damping;
                    this.updateCamera();
                }
            }
        }

        const ShaderLib = {
            Points: {
                vs100: `precision highp float;
attribute vec3 aPosition;
attribute vec4 aColor;
uniform mat4 uMVP;
uniform float uPointSize;
varying vec4 vColor;
void main(){
  vColor = aColor;
  gl_Position = uMVP * vec4(aPosition, 1.0);
  gl_PointSize = uPointSize;
}`,
                fs100: `precision highp float;
varying vec4 vColor;
uniform vec4 uColor;
uniform float uRoundPoints;
void main(){
  vec4 c = vColor * uColor;
  if (uRoundPoints > 0.5) {
    vec2 p = gl_PointCoord*2.0 - 1.0;
    if (dot(p,p) > 1.0) discard;
  }
  gl_FragColor = c;
}`,
                vs300: `#version 300 es
precision highp float;
in vec3 aPosition;
in vec4 aColor;
uniform mat4 uMVP;
uniform float uPointSize;
out vec4 vColor;
void main(){
  vColor = aColor;
  gl_Position = uMVP * vec4(aPosition, 1.0);
  gl_PointSize = uPointSize;
}`,
                fs300: `#version 300 es
precision highp float;
in vec4 vColor;
uniform vec4 uColor;
uniform float uRoundPoints;
out vec4 outColor;
void main(){
  vec4 c = vColor * uColor;
  if (uRoundPoints > 0.5) {
    vec2 p = gl_PointCoord*2.0 - 1.0;
    if (dot(p,p) > 1.0) discard;
  }
  outColor = c;
}`,
            },
            Mesh: {
                vs100: `precision highp float;
attribute vec3 aPosition;
attribute vec3 aNormal;
attribute vec4 aColor;
uniform mat4 uMVP;
uniform mat3 uNormalMat;
varying vec4 vColor;
varying vec3 vN;
void main(){
  vColor = aColor;
  vN = normalize(uNormalMat * aNormal);
  gl_Position = uMVP * vec4(aPosition, 1.0);
}`,
                fs100: `precision highp float;
varying vec4 vColor;
varying vec3 vN;
uniform vec4 uColor;
uniform float uUseFakeLight;
void main(){
  vec4 c = vColor * uColor;
  if (uUseFakeLight > 0.5) {
    vec3 L = normalize(vec3(0.35, 0.85, 0.55));
    float ndl = max(dot(normalize(vN), L), 0.0);
    c.rgb *= (0.22 + 0.78*ndl);
  }
  gl_FragColor = c;
}`,
                vs300: `#version 300 es
precision highp float;
in vec3 aPosition;
in vec3 aNormal;
in vec4 aColor;
uniform mat4 uMVP;
uniform mat3 uNormalMat;
out vec4 vColor;
out vec3 vN;
void main(){
  vColor = aColor;
  vN = normalize(uNormalMat * aNormal);
  gl_Position = uMVP * vec4(aPosition, 1.0);
}`,
                fs300: `#version 300 es
precision highp float;
in vec4 vColor;
in vec3 vN;
uniform vec4 uColor;
uniform float uUseFakeLight;
out vec4 outColor;
void main(){
  vec4 c = vColor * uColor;
  if (uUseFakeLight > 0.5) {
    vec3 L = normalize(vec3(0.35, 0.85, 0.55));
    float ndl = max(dot(normalize(vN), L), 0.0);
    c.rgb *= (0.22 + 0.78*ndl);
  }
  outColor = c;
}`,
            },
            Lines: {
                vs100: `precision highp float;
attribute vec3 aPosition;
uniform mat4 uMVP;
void main(){ gl_Position = uMVP * vec4(aPosition, 1.0); }`,
                fs100: `precision highp float;
uniform vec4 uColor;
void main(){ gl_FragColor = uColor; }`,
                vs300: `#version 300 es
precision highp float;
in vec3 aPosition;
uniform mat4 uMVP;
void main(){ gl_Position = uMVP * vec4(aPosition, 1.0); }`,
                fs300: `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 outColor;
void main(){ outColor = uColor; }`,
            }
        };

        const canvas = document.getElementById("c");
        const device = GLDevice.createFromCanvas(canvas, { antialias: true, alpha: false, powerPreference: "high-performance" });
        const gl = device.gl;
        const renderer = new Renderer(device);
        const scene = new Scene();
        scene.backgroundColor = vec4.fromValues(0.05, 0.06, 0.09, 1);

        const camera = new BasicCamera();
        const controls = new OrbitControls(canvas, camera);

        const progPoints = Program.fromSources(device, ShaderLib.Points);
        const progMesh = Program.fromSources(device, ShaderLib.Mesh);
        const progLines = Program.fromSources(device, ShaderLib.Lines);

        let currentModel = null;
        let currentCPUData = null;
        let globalBBox = null;

        const measurements = [];
        let measureEnabled = false;
        let pendingPoint = null;

        const measureLineMesh = Mesh.fromData(device, { attributes: { aPosition: { data: new Float32Array(0), size: 3, usage: gl.DYNAMIC_DRAW } }, indices: null, mode: gl.LINES });
        const measureLineMat = new Material(progLines, { depthTest: false, depthWrite: false, blend: true, cull: false, uniforms: { uColor: vec4.fromValues(0.95, 0.95, 0.2, 1.0) } });
        const measureLinesModel = new Model(measureLineMesh, measureLineMat, "measure-lines");
        scene.add(measureLinesModel);

        const measurePointMesh = Mesh.fromData(device, {
            attributes: { aPosition: { data: new Float32Array(0), size: 3, usage: gl.DYNAMIC_DRAW }, aColor: { data: new Float32Array(0), size: 4, usage: gl.DYNAMIC_DRAW } },
            indices: null, mode: gl.POINTS
        });
        const measurePointMat = new Material(progPoints, { depthTest: false, depthWrite: false, blend: true, cull: false, uniforms: { uColor: vec4.fromValues(1, 1, 1, 1), uPointSize: 9.0, uRoundPoints: 1.0 } });
        const measurePointsModel = new Model(measurePointMesh, measurePointMat, "measure-points");
        scene.add(measurePointsModel);

        function updateMeasureMeshes() {
            const segPos = new Float32Array(measurements.length * 2 * 3);
            for (let i = 0; i < measurements.length; i++) {
                const m = measurements[i];
                segPos.set(m.a, i * 6 + 0);
                segPos.set(m.b, i * 6 + 3);
            }
            const pts = [];
            const cols = [];
            for (const m of measurements) {
                pts.push(...m.a, ...m.b);
                cols.push(1, 0.35, 0.2, 1, 0.2, 0.75, 1, 1);
            }
            if (pendingPoint) {
                pts.push(...pendingPoint);
                cols.push(0.9, 0.9, 0.25, 1);
            }

            const lineAttr = measureLineMesh.attributes.find(a => a.name === "aPosition");
            gl.bindBuffer(gl.ARRAY_BUFFER, lineAttr.buffer);
            gl.bufferData(gl.ARRAY_BUFFER, segPos, gl.DYNAMIC_DRAW);
            measureLineMesh.vertexCount = (segPos.length / 3) | 0;
            measureLineMesh.vao = null;

            const pAttr = measurePointMesh.attributes.find(a => a.name === "aPosition");
            const cAttr = measurePointMesh.attributes.find(a => a.name === "aColor");
            gl.bindBuffer(gl.ARRAY_BUFFER, pAttr.buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pts), gl.DYNAMIC_DRAW);
            gl.bindBuffer(gl.ARRAY_BUFFER, cAttr.buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(cols), gl.DYNAMIC_DRAW);
            measurePointMesh.vertexCount = (pts.length / 3) | 0;
            measurePointMesh.vao = null;

            renderMeasureList();
        }

        const listEl = document.getElementById("measureList");
        function renderMeasureList() {
            if (measurements.length === 0 && !pendingPoint) {
                listEl.innerHTML = `<div style="opacity:.6; text-align:center;">暂无测量</div>`;
                return;
            }
            const rows = measurements.map((m, idx) => {
                const d = m.dist;
                return `<div class="measure-item"><div>#${idx + 1}</div><div>${d.toFixed(4)}</div></div>`;
            }).join("");
            const pending = pendingPoint ? `<div style="opacity:.75; padding:4px 6px;">已选 1 点，继续选第 2 点…</div>` : "";
            listEl.innerHTML = rows + pending;
        }

        function colorRamp(t) {
            t = Math.max(0, Math.min(1, t));
            const stops = [
                { t: 0.0, c: [0.10, 0.30, 1.00] },
                { t: 0.25, c: [0.10, 0.95, 1.00] },
                { t: 0.5, c: [0.20, 1.00, 0.25] },
                { t: 0.75, c: [1.00, 0.95, 0.10] },
                { t: 1.0, c: [1.00, 0.15, 0.10] },
            ];
            for (let i = 0; i < stops.length - 1; i++) {
                const a = stops[i], b = stops[i + 1];
                if (t >= a.t && t <= b.t) {
                    const u = (t - a.t) / (b.t - a.t);
                    return [a.c[0] + (b.c[0] - a.c[0]) * u, a.c[1] + (b.c[1] - a.c[1]) * u, a.c[2] + (b.c[2] - a.c[2]) * u, 1.0];
                }
            }
            return [1, 1, 1, 1];
        }

        function ensureMeshColorAttribute(mesh, colorsFloat4) {
            let aColor = mesh.attributes.find(a => a.name === "aColor");
            if (!aColor) {
                const buf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.bufferData(gl.ARRAY_BUFFER, colorsFloat4, gl.STATIC_DRAW);
                mesh.attributes.push({ name: "aColor", buffer: buf, size: 4, type: gl.FLOAT, normalized: false, stride: 0, offset: 0, divisor: 0 });
            } else {
                gl.bindBuffer(gl.ARRAY_BUFFER, aColor.buffer);
                gl.bufferData(gl.ARRAY_BUFFER, colorsFloat4, gl.STATIC_DRAW);
            }
            mesh.vao = null;
        }

        function applyAxisColor(axis) {
            if (!currentModel || !currentCPUData) return;
            if (axis === "none") {
                const vCount = (currentCPUData.positions.length / 3) | 0;
                const colors = currentCPUData.colorsOriginal || currentCPUData.colors || null;
                let out;
                if (colors) out = colors;
                else {
                    out = new Float32Array(vCount * 4);
                    for (let i = 0; i < vCount; i++) { out.set([1, 1, 1, 1], i * 4); }
                }
                ensureMeshColorAttribute(currentModel.mesh, out);
                toast("已恢复原始颜色");
                return;
            }
            const ai = axis === "x" ? 0 : axis === "y" ? 1 : 2;
            const pos = currentCPUData.positions;
            const vCount = (pos.length / 3) | 0;
            let min = Infinity, max = -Infinity;
            for (let i = 0; i < vCount; i++) {
                const v = pos[i * 3 + ai];
                if (v < min) min = v;
                if (v > max) max = v;
            }
            const span = Math.max(1e-9, max - min);
            const out = new Float32Array(vCount * 4);
            for (let i = 0; i < vCount; i++) {
                const t = (pos[i * 3 + ai] - min) / span;
                const c = colorRamp(t);
                out.set(c, i * 4);
            }
            ensureMeshColorAttribute(currentModel.mesh, out);
            toast(`已按 ${axis.toUpperCase()} 轴染色`);
        }

        const _tmpMVP = mat4.create();
        const _tmpV4 = new Float32Array(4);
        const _tmpWorld = vec3.create();

        function mulMat4Vec4(out4, m, x, y, z, w) {
            out4[0] = m[0] * x + m[4] * y + m[8] * z + m[12] * w;
            out4[1] = m[1] * x + m[5] * y + m[9] * z + m[13] * w;
            out4[2] = m[2] * x + m[6] * y + m[10] * z + m[14] * w;
            out4[3] = m[3] * x + m[7] * y + m[11] * z + m[15] * w;
            return out4;
        }

        function pickVertexScreenSpace(mx, my, pixelThreshold = 10) {
            if (!currentModel || !currentCPUData) return null;
            mat4.mul(_tmpMVP, camera.viewProjectionMatrix, currentModel.matrixWorld);
            const pos = currentCPUData.positions;
            const vCount = (pos.length / 3) | 0;
            const w = canvas.width, h = canvas.height;
            if (vCount > 100000) {
                const stride = Math.max(1, Math.floor(vCount / 2000));
                let best = -1;
                let bestD2 = pixelThreshold * pixelThreshold;
                let bestDepth = Infinity;
                for (let i = 0; i < vCount; i += stride) {
                    const x = pos[i * 3 + 0], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
                    mulMat4Vec4(_tmpV4, _tmpMVP, x, y, z, 1);
                    const cw = _tmpV4[3];
                    if (cw <= 1e-6) continue;
                    const ndcX = _tmpV4[0] / cw;
                    const ndcY = _tmpV4[1] / cw;
                    const ndcZ = _tmpV4[2] / cw;
                    if (ndcX < -1 || ndcX > 1 || ndcY < -1 || ndcY > 1 || ndcZ < -1 || ndcZ > 1) continue;
                    const sx = (ndcX * 0.5 + 0.5) * w;
                    const sy = (1 - (ndcY * 0.5 + 0.5)) * h;
                    const dx = sx - mx;
                    const dy = sy - my;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < bestD2) {
                        const depth = ndcZ;
                        if (d2 < bestD2 - 1e-6 || depth < bestDepth) {
                            best = i;
                            bestD2 = d2;
                            bestDepth = depth;
                        }
                    }
                }
                if (best < 0) return null;
                const lx = pos[best * 3 + 0], ly = pos[best * 3 + 1], lz = pos[best * 3 + 2];
                mulMat4Vec4(_tmpV4, currentModel.matrixWorld, lx, ly, lz, 1);
                const iw = _tmpV4[3] || 1;
                _tmpWorld[0] = _tmpV4[0] / iw;
                _tmpWorld[1] = _tmpV4[1] / iw;
                _tmpWorld[2] = _tmpV4[2] / iw;
                return vec3.fromValues(_tmpWorld[0], _tmpWorld[1], _tmpWorld[2]);
            }
            let best = -1;
            let bestD2 = pixelThreshold * pixelThreshold;
            let bestDepth = Infinity;
            for (let i = 0; i < vCount; i++) {
                const x = pos[i * 3 + 0], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
                mulMat4Vec4(_tmpV4, _tmpMVP, x, y, z, 1);
                const cw = _tmpV4[3];
                if (cw <= 1e-6) continue;
                const ndcX = _tmpV4[0] / cw;
                const ndcY = _tmpV4[1] / cw;
                const ndcZ = _tmpV4[2] / cw;
                if (ndcX < -1 || ndcX > 1 || ndcY < -1 || ndcY > 1 || ndcZ < -1 || ndcZ > 1) continue;
                const sx = (ndcX * 0.5 + 0.5) * w;
                const sy = (1 - (ndcY * 0.5 + 0.5)) * h;
                const dx = sx - mx;
                const dy = sy - my;
                const d2 = dx * dx + dy * dy;
                if (d2 < bestD2) {
                    const depth = ndcZ;
                    if (d2 < bestD2 - 1e-6 || depth < bestDepth) {
                        best = i;
                        bestD2 = d2;
                        bestDepth = depth;
                    }
                }
            }
            if (best < 0) return null;
            const lx = pos[best * 3 + 0], ly = pos[best * 3 + 1], lz = pos[best * 3 + 2];
            mulMat4Vec4(_tmpV4, currentModel.matrixWorld, lx, ly, lz, 1);
            const iw = _tmpV4[3] || 1;
            _tmpWorld[0] = _tmpV4[0] / iw;
            _tmpWorld[1] = _tmpV4[1] / iw;
            _tmpWorld[2] = _tmpV4[2] / iw;
            return vec3.fromValues(_tmpWorld[0], _tmpWorld[1], _tmpWorld[2]);
        }

        async function loadModelFromBuffer(buffer, filename) {
            const ext = filename.split(".").pop().toLowerCase();
            let parsed = null;

            try {
                const progressBar = document.getElementById("progressBar");
                const progressFill = document.getElementById("progressFill");
                progressBar.style.display = "block";
                progressFill.style.width = "20%";

                switch (ext) {
                    case "ply": parsed = parsePLY(buffer, { _device: device, computeNormals: true, center: true, scaleToUnit: true }); break;
                    case "obj": parsed = await parseOBJ(buffer, { baseUrl: "", center: true, scaleToUnit: true }); break;
                    case "stl": parsed = await parseSTL(buffer, { center: true, scaleToUnit: true }); break;
                    case "gltf": case "glb": parsed = await parseGLTF(buffer, { center: true, scaleToUnit: true }); break;
                    case "fbx": parsed = await parseFBX(buffer, { center: true, scaleToUnit: true }); break;
                    default: throw new Error(`不支持的格式: ${ext}`);
                }

                progressFill.style.width = "60%";

                if (!parsed || (!parsed.positions && !parsed.submeshes)) {
                    throw new Error("解析结果为空");
                }

                if (currentModel) {
                    currentModel.visible = false;
                }

                const viewMode = document.getElementById("viewMode").value;
                let wantTriangles = false;
                let positions, normals, colors, indices, bbox;

                if (parsed.submeshes && parsed.submeshes.length > 0) {
                    const sm = parsed.submeshes[0];
                    positions = sm.positions;
                    normals = sm.normals;
                    colors = sm.colors;
                    indices = sm.indices;
                    bbox = sm.bbox;
                    wantTriangles = !!indices && viewMode !== "points";
                } else {
                    positions = parsed.positions;
                    normals = parsed.normals;
                    colors = parsed.colors;
                    indices = parsed.indices;
                    bbox = parsed.bbox;
                    wantTriangles = !!indices && viewMode !== "points";
                }

                globalBBox = bbox;

                const vCount = (positions.length / 3) | 0;
                if (!colors) {
                    const c = new Float32Array(vCount * 4);
                    for (let i = 0; i < vCount; i++) c.set([1, 1, 1, 1], i * 4);
                    colors = c;
                }

                if (wantTriangles && !normals) {
                    const n = new Float32Array(vCount * 3);
                    for (let i = 0; i < vCount; i++) { n[i * 3 + 1] = 1; }
                    normals = n;
                }

                const mode = wantTriangles ? gl.TRIANGLES : gl.POINTS;
                const attrs = { aPosition: { data: positions, size: 3 }, aColor: { data: colors, size: 4 } };
                if (wantTriangles) attrs.aNormal = { data: normals, size: 3 };

                const mesh = Mesh.fromData(device, { attributes: attrs, indices: wantTriangles ? indices : null, mode });

                const program = wantTriangles ? progMesh : progPoints;
                const material = new Material(program, {
                    depthTest: true, depthWrite: true, blend: false, cull: wantTriangles,
                    uniforms: {
                        uColor: hexToVec4(document.getElementById("modelColor").value),
                        uPointSize: parseFloat(document.getElementById("pointSize").value),
                        uRoundPoints: 1.0,
                        uUseFakeLight: document.getElementById("fakeLight").checked ? 1.0 : 0.0
                    }
                });

                currentModel = new Model(mesh, material, filename);
                currentCPUData = { positions, normals, colors, indices, bbox };
                currentCPUData.colorsOriginal = colors.slice ? colors.slice() : new Float32Array(colors);
                scene.add(currentModel);

                controls.setFromBounds(bbox);

                updateStats({ name: filename, vertexCount: vCount, triangleCount: wantTriangles ? ((indices.length / 3) | 0) : 0, bbox: bbox });

                document.getElementById("modelInfo").style.display = "block";
                document.getElementById("modelName").textContent = filename;
                document.getElementById("modelProps").innerHTML = `<span>${vCount.toLocaleString()} 顶点</span><span>${(wantTriangles ? ((indices.length / 3) | 0) : 0).toLocaleString()} 面</span>`;

                applyAxisColor(document.getElementById("axisColor").value);
                clearMeasurements();

                progressFill.style.width = "100%";
                setTimeout(() => progressBar.style.display = "none", 200);

                toast(`加载成功: ${filename}`);
            } catch (e) {
                console.error(e);
                toast(`加载失败: ${e.message}`, 5000);
                document.getElementById("progressBar").style.display = "none";
            }
        }

        function hexToVec4(hex) {
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;
            return vec4.fromValues(r, g, b, 1);
        }

        function updateStats(info) {
            const st = document.getElementById("stats");
            const b = info.bbox;
            const sx = b ? (b.max[0] - b.min[0]).toFixed(3) : "-";
            const sy = b ? (b.max[1] - b.min[1]).toFixed(3) : "-";
            const sz = b ? (b.max[2] - b.min[2]).toFixed(3) : "-";

            st.innerHTML = `<div>模型：${info.name || "-"}</div><div>顶点：${info.vertexCount?.toLocaleString() || "-"}</div><div>三角形：${info.triangleCount?.toLocaleString() || "-"}</div><div>包围盒：${sx} × ${sy} × ${sz}</div>`;
            document.getElementById("renderStats").textContent = `三角形: ${info.triangleCount?.toLocaleString() || "0"}`;
        }

        function clearMeasurements() {
            measurements.length = 0;
            pendingPoint = null;
            updateMeasureMeshes();
        }

        function addMeasurement(a, b) {
            const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
            const dist = Math.hypot(dx, dy, dz);
            measurements.push({ a, b, dist });
            pendingPoint = null;
            updateMeasureMeshes();
        }

        function exportModel(format) {
            if (!currentCPUData) { toast("请先加载模型"); return; }
            const { positions, colors, indices } = currentCPUData;
            let content = "";
            let filename = "";

            switch (format) {
                case "ply": content = exportPLY(positions, colors, indices); filename = "model.ply"; break;
                case "stl": content = exportSTL(positions, indices); filename = "model.stl"; break;
                case "obj": content = exportOBJ(positions, colors, indices); filename = "model.obj"; break;
            }

            const blob = new Blob([content], { type: format === "stl" ? "application/octet-stream" : "text/plain" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            toast(`已导出: ${filename}`);
        }

        function exportPLY(positions, colors, indices) {
            const vCount = positions.length / 3;
            const fCount = indices ? indices.length / 3 : 0;
            const hasColors = colors && colors.length > 0;

            let header = `ply\nformat ascii 1.0\nelement vertex ${vCount}\nproperty float x\nproperty float y\nproperty float z`;
            if (hasColors) header += "\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nproperty uchar alpha";
            header += `\nelement face ${fCount}\nproperty list uchar int vertex_indices\nend_header\n`;

            let body = "";
            for (let i = 0; i < vCount; i++) {
                const x = positions[i * 3 + 0], y = positions[i * 3 + 1], z = positions[i * 3 + 2];
                if (hasColors) {
                    const r = Math.round(colors[i * 4 + 0] * 255);
                    const g = Math.round(colors[i * 4 + 1] * 255);
                    const b = Math.round(colors[i * 4 + 2] * 255);
                    const a = Math.round(colors[i * 4 + 3] * 255);
                    body += `${x} ${y} ${z} ${r} ${g} ${b} ${a}\n`;
                } else {
                    body += `${x} ${y} ${z}\n`;
                }
            }

            if (indices) {
                for (let i = 0; i < fCount; i++) {
                    const i0 = indices[i * 3 + 0], i1 = indices[i * 3 + 1], i2 = indices[i * 3 + 2];
                    body += `3 ${i0} ${i1} ${i2}\n`;
                }
            }

            return header + body;
        }

        function exportSTL(positions, indices) {
            const fCount = indices ? indices.length / 3 : 0;
            const header = new Uint8Array(80);
            const textEncoder = new TextEncoder();
            const nameBytes = textEncoder.encode("Exported from Viewer");
            header.set(nameBytes, 0);

            const fCountBytes = new Uint32Array([fCount]);

            const triangles = [];
            if (indices) {
                for (let i = 0; i < fCount; i++) {
                    const i0 = indices[i * 3 + 0], i1 = indices[i * 3 + 1], i2 = indices[i * 3 + 2];
                    const v0 = [positions[i0 * 3], positions[i0 * 3 + 1], positions[i0 * 3 + 2]];
                    const v1 = [positions[i1 * 3], positions[i1 * 3 + 1], positions[i1 * 3 + 2]];
                    const v2 = [positions[i2 * 3], positions[i2 * 3 + 1], positions[i2 * 3 + 2]];
                    const nx = (v1[1] - v0[1]) * (v2[2] - v0[2]) - (v1[2] - v0[2]) * (v2[1] - v0[1]);
                    const ny = (v1[2] - v0[2]) * (v2[0] - v0[0]) - (v1[0] - v0[0]) * (v2[2] - v0[2]);
                    const nz = (v1[0] - v0[0]) * (v2[1] - v0[1]) - (v1[1] - v0[1]) * (v2[0] - v0[0]);
                    const nLen = Math.hypot(nx, ny, nz) || 1;
                    const normal = [nx / nLen, ny / nLen, nz / nLen];

                    const triData = new Float32Array([...normal, ...v0, ...v1, ...v2]);
                    const triUint = new Uint8Array(triData.buffer);
                    triangles.push(...triUint);

                    const attrBytes = new Uint16Array([0]);
                    triangles.push(...attrBytes);
                }
            }

            const totalSize = 80 + 4 + triangles.length;
            const result = new Uint8Array(totalSize);
            result.set(header, 0);
            const fCountView = new Uint32Array(result.buffer, 80, 1);
            fCountView[0] = fCount;
            result.set(triangles, 84);

            return result;
        }

        function exportOBJ(positions, colors, indices) {
            const vCount = positions.length / 3;
            let obj = "";
            for (let i = 0; i < vCount; i++) {
                obj += `v ${positions[i * 3]} ${positions[i * 3 + 1]} ${positions[i * 3 + 2]}\n`;
            }
            if (indices) {
                const fCount = indices.length / 3;
                for (let i = 0; i < fCount; i++) {
                    const i0 = indices[i * 3 + 0] + 1;
                    const i1 = indices[i * 3 + 1] + 1;
                    const i2 = indices[i * 3 + 2] + 1;
                    obj += `f ${i0} ${i1} ${i2}\n`;
                }
            }
            return obj;
        }

        canvas.addEventListener("click", e => {
            if (!measureEnabled) return;
            if (!currentModel || !currentCPUData) return;
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);
            const p = pickVertexScreenSpace(mx, my, 10);
            if (!p) { toast("未命中点"); return; }
            if (!pendingPoint) { pendingPoint = p; updateMeasureMeshes(); }
            else { addMeasurement(pendingPoint, p); }
        });

        const fileEl = document.getElementById("file");
        fileEl.addEventListener("change", async e => {
            const f = e.target.files?.[0];
            if (!f) return;
            const buf = await f.arrayBuffer();
            await loadModelFromBuffer(buf, f.name);
            fileEl.value = "";
        });

        document.getElementById("btnDemo").addEventListener("click", async () => {
            toast("加载示例模型...", 3000);
        });

        document.getElementById("btnLoadUrl").addEventListener("click", async () => {
            const url = document.getElementById("urlInput").value.trim();
            if (!url) { toast("请输入 URL"); return; }
            try {
                const r = await fetch(url);
                if (!r.ok) throw new Error("HTTP " + r.status);
                const buf = await r.arrayBuffer();
                const filename = url.split("/").pop();
                await loadModelFromBuffer(buf, filename);
            } catch (e) { toast(`URL 加载失败: ${e.message}`, 5000); }
        });

        document.getElementById("pointSize").addEventListener("input", e => {
            const v = parseFloat(e.target.value);
            document.getElementById("pointSizeVal").textContent = v.toFixed(1);
            if (currentModel?.material) currentModel.material.uniforms.uPointSize = v;
            measurePointsModel.material.uniforms.uPointSize = Math.max(7.0, v * 3.2);
        });

        document.getElementById("modelColor").addEventListener("input", e => {
            const color = hexToVec4(e.target.value);
            if (currentModel?.material) currentModel.material.uniforms.uColor = color;
        });

        document.getElementById("fakeLight").addEventListener("change", e => {
            const on = e.target.checked ? 1.0 : 0.0;
            if (currentModel?.material) currentModel.material.uniforms.uUseFakeLight = on;
        });

        document.getElementById("bgMode").addEventListener("change", e => {
            const mode = e.target.value;
            if (mode === "gradient") canvas.style.background = "radial-gradient(ellipse at center, #1a1f2e 0%, #0a0e14 100%)";
            else if (mode === "solid") canvas.style.background = document.getElementById("bgColor").value;
            else if (mode === "grid") canvas.style.background = "linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px), #0a0e14";
        });

        document.getElementById("bgColor").addEventListener("input", e => {
            if (document.getElementById("bgMode").value === "solid") canvas.style.background = e.target.value;
        });

        document.getElementById("btnApplyAxis").addEventListener("click", () => applyAxisColor(document.getElementById("axisColor").value));

        document.getElementById("btnMeasure").addEventListener("click", e => {
            measureEnabled = !measureEnabled;
            e.target.textContent = measureEnabled ? "关闭测量" : "开启测量";
            e.target.classList.toggle("primary", measureEnabled);
            pendingPoint = null;
            updateMeasureMeshes();
            toast(measureEnabled ? "测量已开启" : "测量已关闭");
        });

        document.getElementById("btnClearMeasure").addEventListener("click", clearMeasurements);

        document.getElementById("btnScreenshot").addEventListener("click", () => {
            const link = document.createElement("a");
            link.download = `screenshot_${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            toast("截图已保存");
        });

        document.getElementById("btnClear").addEventListener("click", () => {
            if (currentModel) {
                currentModel.visible = false;
                currentModel = null;
                currentCPUData = null;
                globalBBox = null;
            }
            clearMeasurements();
            updateStats({});
            document.getElementById("modelInfo").style.display = "none";
            toast("模型已清空");
        });

        document.getElementById("btnResetTransform").addEventListener("click", () => {
            if (currentModel) {
                mat4.identity(currentModel.matrixWorld);
                document.getElementById("posX").value = "0";
                document.getElementById("posY").value = "0";
                document.getElementById("posZ").value = "0";
                document.getElementById("scaleX").value = "1";
                document.getElementById("scaleY").value = "1";
                document.getElementById("scaleZ").value = "1";
            }
            toast("变换已重置");
        });

        document.getElementById("btnCenter").addEventListener("click", () => {
            if (globalBBox) { controls.setFromBounds(globalBBox); toast("已居中"); }
        });

        ["posX", "posY", "posZ"].forEach((id, idx) => {
            document.getElementById(id).addEventListener("input", e => {
                if (!currentModel) return;
                const val = parseFloat(e.target.value) || 0;
                currentModel.matrixWorld[12 + idx] = val;
            });
        });

        ["scaleX", "scaleY", "scaleZ"].forEach((id, idx) => {
            document.getElementById(id).addEventListener("input", e => {
                if (!currentModel) return;
                const val = parseFloat(e.target.value) || 1;
                currentModel.matrixWorld[idx * 5] = val;
            });
        });

        document.getElementById("viewMode").addEventListener("change", e => {
            if (!currentModel || !currentCPUData) return;
            const mode = e.target.value;
            const wantTriangles = mode !== "points" && currentCPUData.indices;
            const newMode = wantTriangles ? gl.TRIANGLES : gl.POINTS;
            currentModel.mesh.mode = newMode;
            currentModel.mesh.vao = null;
            const program = wantTriangles ? progMesh : progPoints;
            const uniforms = {
                uColor: currentModel.material.uniforms.uColor,
                uPointSize: currentModel.material.uniforms.uPointSize,
                uRoundPoints: 1.0,
                uUseFakeLight: document.getElementById("fakeLight").checked ? 1.0 : 0.0
            };
            currentModel.material = new Material(program, {
                depthTest: true, depthWrite: true, blend: false, cull: wantTriangles, uniforms
            });
            if (wantTriangles && !currentCPUData.normals) {
                const vCount = (currentCPUData.positions.length / 3) | 0;
                const n = new Float32Array(vCount * 3);
                for (let i = 0; i < vCount; i++) { n[i * 3 + 1] = 1; }
                currentCPUData.normals = n;
                currentModel.mesh.attributes.push({
                    name: "aNormal", buffer: gl.createBuffer(), size: 3, type: gl.FLOAT, normalized: false, stride: 0, offset: 0, divisor: 0
                });
                const attr = currentModel.mesh.attributes.find(a => a.name === "aNormal");
                gl.bindBuffer(gl.ARRAY_BUFFER, attr.buffer);
                gl.bufferData(gl.ARRAY_BUFFER, n, gl.STATIC_DRAW);
                currentModel.mesh.vao = null;
            }
            toast(`显示模式: ${mode === "auto" ? "自动" : mode === "points" ? "点云" : "网格"}`);
        });

        document.getElementById("btnExport").addEventListener("click", () => {
            const menu = document.getElementById("exportMenu");
            menu.classList.toggle("show");
        });

        document.querySelectorAll(".export-option").forEach(opt => {
            opt.addEventListener("click", () => {
                exportModel(opt.dataset.format);
                document.getElementById("exportMenu").classList.remove("show");
            });
        });

        document.getElementById("btnViewFront").addEventListener("click", () => controls.setView("front"));
        document.getElementById("btnViewBack").addEventListener("click", () => controls.setView("back"));
        document.getElementById("btnViewLeft").addEventListener("click", () => controls.setView("left"));
        document.getElementById("btnViewRight").addEventListener("click", () => controls.setView("right"));
        document.getElementById("btnViewTop").addEventListener("click", () => controls.setView("top"));
        document.getElementById("btnViewBottom").addEventListener("click", () => controls.setView("bottom"));

        document.addEventListener("click", e => {
            const menu = document.getElementById("exportMenu");
            const btn = document.getElementById("btnExport");
            if (!btn.contains(e.target) && !menu.contains(e.target)) menu.classList.remove("show");
        });

        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 60;

        function resize() {
            renderer.resizeToDisplaySize(canvas);
            camera.setPerspective(camera.fovY, canvas.width / canvas.height, 0.01, 5000);
        }
        window.addEventListener("resize", resize);
        resize();

        function syncUniforms() {
            const ps = parseFloat(document.getElementById("pointSize").value);
            if (currentModel?.material) currentModel.material.uniforms.uPointSize = ps;
            measurePointsModel.material.uniforms.uPointSize = Math.max(7.0, ps * 3.2);
        }

        function frame() {
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fps = Math.round(frameCount * 1000 / (now - lastTime));
                document.getElementById("fpsValue").textContent = fps;
                frameCount = 0;
                lastTime = now;
            }
            resize();
            syncUniforms();
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(frame);
        }
        frame();

        toast("请导入模型或点击加载示例", 3500);
    </script>
</body>
</html>
