<!doctype html>
<html>

<head>
<title>Three.js入门 - 基础3D场景</title>
<style>
body { margin: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
canvas { width: 100vw; height: 100vh; display: block; }
#info {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  background: rgba(0, 0, 0, 0.6);
  padding: 12px 16px;
  border-radius: 6px;
  font-size: 14px;
  line-height: 1.6;
}
#info h3 { margin: 0 0 8px 0; font-size: 16px; color: #6cf; }
</style>
</head>

<body>
<div id="info">
  <h3>Three.js 入门</h3>
  <div>✓ 旋转立方体</div>
  <div>✓ 静态球体</div>
  <div>✓ 地板平面</div>
  <div>✓ 平行光 + 环境光</div>
  <div>✓ 透视摄像机环绕飞行</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222840);

  var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(5, 4, 8);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  var cubeGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
  var cubeMaterials = [
    new THREE.MeshPhongMaterial({ color: 0xff4444 }),
    new THREE.MeshPhongMaterial({ color: 0x44ff44 }),
    new THREE.MeshPhongMaterial({ color: 0x4488ff }),
    new THREE.MeshPhongMaterial({ color: 0xffff44 }),
    new THREE.MeshPhongMaterial({ color: 0xff44ff }),
    new THREE.MeshPhongMaterial({ color: 0x44ffff })
  ];
  var cube = new THREE.Mesh(cubeGeometry, cubeMaterials);
  cube.position.set(-2, 1, 0);
  cube.castShadow = true;
  scene.add(cube);

  var sphereGeometry = new THREE.SphereGeometry(1.2, 32, 32);
  var sphereMaterial = new THREE.MeshPhongMaterial({ color: 0xffaa44, shininess: 80 });
  var sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
  sphere.position.set(2, 1.2, 0);
  sphere.castShadow = true;
  scene.add(sphere);

  var floorGeometry = new THREE.PlaneGeometry(20, 20);
  var floorMaterial = new THREE.MeshPhongMaterial({ color: 0x88a888 });
  var floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  var ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  var directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(5, 10, 7);
  directionalLight.castShadow = true;
  directionalLight.shadow.mapSize.width = 1024;
  directionalLight.shadow.mapSize.height = 1024;
  scene.add(directionalLight);

  var camAngle = 0;
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.012;
    cube.position.y = 1 + Math.sin(Date.now() * 0.002) * 0.3;
    camAngle += 0.005;
    var camDist = 10;
    camera.position.x = Math.sin(camAngle) * camDist;
    camera.position.z = Math.cos(camAngle) * camDist;
    camera.position.y = 4 + Math.sin(camAngle * 0.5) * 1.5;
    camera.lookAt(0, 1, 0);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>

</html>
