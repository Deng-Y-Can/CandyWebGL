<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-动画系统 - Three.js学习教程</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        .info { position: fixed; top: 10px; left: 10px; color: white; font-family: Arial; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="info">
        <h3>动画系统展示</h3>
        <p>requestAnimationFrame - 基础动画（左侧立方体）</p>
        <p>属性插值动画 - 平滑移动（中间球体）</p>
        <p>缩放动画 - 脉冲效果（右侧圆环）</p>
    </div>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';

        // 创建场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 创建相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 12;

        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 创建几何体数组
        const meshes = [];

        // 1. 左侧立方体 - 旋转动画
        const cubeGeometry = new THREE.BoxGeometry(2, 2, 2);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff88 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.set(-5, 0, 0);
        scene.add(cube);
        meshes.push(cube);

        // 2. 中间球体 - 移动动画
        const sphereGeometry = new THREE.SphereGeometry(1.5, 32, 32);
        const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0xff6b6b });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(0, 0, 0);
        scene.add(sphere);
        meshes.push(sphere);

        // 3. 右侧圆环 - 缩放动画
        const torusGeometry = new THREE.TorusGeometry(1.2, 0.4, 16, 100);
        const torusMaterial = new THREE.MeshStandardMaterial({ color: 0x4ecdc4 });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        torus.position.set(5, 0, 0);
        scene.add(torus);
        meshes.push(torus);

        // 添加环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // 添加点光源
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 10, 5);
        scene.add(pointLight);

        // 动画状态
        let time = 0;

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // 1. requestAnimationFrame基础动画 - 旋转立方体
            cube.rotation.x += 0.02;
            cube.rotation.y += 0.01;

            // 2. 属性插值动画 - 球体上下移动
            sphere.position.y = Math.sin(time) * 2;
            sphere.position.x = Math.cos(time * 0.5) * 2;

            // 3. 缩放动画 - 圆环脉冲效果
            const scale = 1 + Math.sin(time * 2) * 0.3;
            torus.scale.set(scale, scale, scale);
            torus.rotation.z += 0.03;

            // 所有物体绕Y轴旋转
            meshes.forEach((mesh) => {
                mesh.rotation.z += 0.005;
            });

            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
