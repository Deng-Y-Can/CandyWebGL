<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08-粒子系统 - Three.js学习教程</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        .info { position: fixed; top: 10px; left: 10px; color: white; font-family: Arial; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="info">
        <h3>粒子系统 - 星空效果</h3>
        <p>使用 Points 创建粒子效果</p>
        <p>鼠标左键拖拽旋转视角</p>
        <p>滚轮缩放</p>
    </div>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        // 创建场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        // 创建相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 创建轨道控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 粒子数量
        const particleCount = 5000;

        // 创建粒子几何体
        const particlesGeometry = new THREE.BufferGeometry();

        // 创建位置数组
        const positions = new Float32Array(particleCount * 3);
        // 创建颜色数组
        const colors = new Float32Array(particleCount * 3);
        // 创建大小数组
        const sizes = new Float32Array(particleCount);

        // 填充粒子数据
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            
            // 随机位置（球形分布）
            const radius = 100;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i3 + 2] = radius * Math.cos(phi);
            
            // 随机颜色（星空颜色）
            const colorChoice = Math.random();
            if (colorChoice < 0.7) {
                // 白色/淡蓝色
                colors[i3] = 0.8 + Math.random() * 0.2;
                colors[i3 + 1] = 0.8 + Math.random() * 0.2;
                colors[i3 + 2] = 1;
            } else if (colorChoice < 0.85) {
                // 黄色
                colors[i3] = 1;
                colors[i3 + 1] = 1;
                colors[i3 + 2] = 0.5;
            } else {
                // 红色/橙色
                colors[i3] = 1;
                colors[i3 + 1] = 0.5 + Math.random() * 0.3;
                colors[i3 + 2] = 0.3;
            }
            
            // 随机大小
            sizes[i] = Math.random() * 2 + 0.5;
        }

        // 设置几何体属性
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particlesGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // 创建粒子材质
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.5,
            vertexColors: true,           // 使用顶点颜色
            transparent: true,            // 透明
            opacity: 0.8,                 // 透明度
            sizeAttenuation: true,        // 大小衰减（远处粒子更小）
            blending: THREE.AdditiveBlending,  // 加法混合
            depthWrite: false             // 关闭深度写入（避免透明问题）
        });

        // 创建粒子系统
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // 添加一些大星星作为装饰
        const bigStarGeometry = new THREE.BufferGeometry();
        const bigStarPositions = new Float32Array(20 * 3);
        const bigStarColors = new Float32Array(20 * 3);
        const bigStarSizes = new Float32Array(20);

        for (let i = 0; i < 20; i++) {
            const i3 = i * 3;
            const radius = 50 + Math.random() * 30;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            bigStarPositions[i3] = radius * Math.sin(phi) * Math.cos(theta);
            bigStarPositions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            bigStarPositions[i3 + 2] = radius * Math.cos(phi);
            
            bigStarColors[i3] = 1;
            bigStarColors[i3 + 1] = 1;
            bigStarColors[i3 + 2] = 0.8;
            
            bigStarSizes[i] = 3 + Math.random() * 2;
        }

        bigStarGeometry.setAttribute('position', new THREE.BufferAttribute(bigStarPositions, 3));
        bigStarGeometry.setAttribute('color', new THREE.BufferAttribute(bigStarColors, 3));
        bigStarGeometry.setAttribute('size', new THREE.BufferAttribute(bigStarSizes, 1));

        const bigStarMaterial = new THREE.PointsMaterial({
            size: 1,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const bigStars = new THREE.Points(bigStarGeometry, bigStarMaterial);
        scene.add(bigStars);

        // 动画状态
        let time = 0;

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;
            
            controls.update();
            
            // 旋转粒子系统
            particles.rotation.y += 0.001;
            particles.rotation.x = Math.sin(time * 0.5) * 0.1;
            
            bigStars.rotation.y -= 0.0005;
            
            // 闪烁效果
            const sizesArray = particles.geometry.attributes.size.array;
            for (let i = 0; i < particleCount; i++) {
                sizesArray[i] = (1 + Math.sin(time * 3 + i * 0.1)) * 1.5;
            }
            particles.geometry.attributes.size.needsUpdate = true;
            
            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
