<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06-相机控制 - Three.js学习教程</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        .info { position: fixed; top: 10px; left: 10px; color: white; font-family: Arial; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="info">
        <h3>OrbitControls 轨道控制器</h3>
        <p>左键拖拽 - 旋转视角</p>
        <p>右键拖拽 - 平移视角</p>
        <p>滚轮 - 缩放视角</p>
    </div>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        // 创建场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 创建相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 创建轨道控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        // 设置控制器参数
        controls.enableDamping = true;              // 启用阻尼
        controls.dampingFactor = 0.05;              // 阻尼系数
        controls.enableZoom = true;                 // 启用缩放
        controls.enablePan = true;                  // 启用平移
        controls.minDistance = 3;                   // 最小距离
        controls.maxDistance = 30;                  // 最大距离
        controls.maxPolarAngle = Math.PI / 2;       // 最大垂直角度

        // 创建多个几何体展示场景
        const colors = [0x00ff88, 0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa855f7, 0xf38181];
        const geometryTypes = [
            () => new THREE.BoxGeometry(1.5, 1.5, 1.5),
            () => new THREE.SphereGeometry(1.2, 32, 32),
            () => new THREE.ConeGeometry(1, 2, 32),
            () => new THREE.TorusGeometry(1, 0.3, 16, 100),
            () => new THREE.CylinderGeometry(0.8, 0.8, 2, 32),
            () => new THREE.IcosahedronGeometry(1.2)
        ];

        // 位置布局（六边形排列）
        const positions = [
            [0, 0, 0],    // 中心
            [-3, 0, 2],   // 左上
            [3, 0, 2],    // 右上
            [-4, 0, -2],  // 左下
            [4, 0, -2],   // 右下
            [0, 0, -4]    // 后
        ];

        // 创建网格对象
        positions.forEach((pos, index) => {
            const geometry = geometryTypes[index]();
            const material = new THREE.MeshStandardMaterial({
                color: colors[index],
                roughness: 0.4,
                metalness: 0.2
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(...pos);
            scene.add(mesh);
        });

        // 添加环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // 添加主光源
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // 添加辅助光源
        const pointLight = new THREE.PointLight(0x4ecdc4, 0.5);
        pointLight.position.set(-5, 5, -5);
        scene.add(pointLight);

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新控制器（需要在动画循环中调用以实现阻尼效果）
            controls.update();
            
            // 旋转中心物体
            const centerMesh = scene.children.find((child) => {
                return child instanceof THREE.Mesh && child.position.x === 0 && child.position.z === 0;
            });
            if (centerMesh) {
                centerMesh.rotation.x += 0.01;
                centerMesh.rotation.y += 0.01;
            }
            
            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
