<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02-几何体 - Three.js学习教程</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';

        // 创建场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 创建相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 几何体颜色数组
        const colors = [0x00ff88, 0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3, 0xf38181];

        // 创建各种几何体
        const geometries = [
            // 立方体
            new THREE.BoxGeometry(2, 2, 2),
            // 球体
            new THREE.SphereGeometry(1.5, 32, 32),
            // 圆锥
            new THREE.ConeGeometry(1.5, 3, 32),
            // 圆环
            new THREE.TorusGeometry(1.5, 0.5, 16, 100),
            // 圆柱体
            new THREE.CylinderGeometry(1, 1, 3, 32),
            // 二十面体
            new THREE.IcosahedronGeometry(1.5)
        ];

        // 几何体位置布局
        const positions = [
            [-6, 2, 0],   // 立方体
            [0, 2, 0],    // 球体
            [6, 2, 0],    // 圆锥
            [-4, -3, 0],  // 圆环
            [0, -3, 0],   // 圆柱体
            [4, -3, 0]    // 二十面体
        ];

        // 创建网格并添加到场景
        geometries.forEach((geometry, index) => {
            const material = new THREE.MeshStandardMaterial({
                color: colors[index],
                roughness: 0.5,
                metalness: 0.3
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(...positions[index]);
            scene.add(mesh);
        });

        // 添加环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // 添加点光源
        const pointLight1 = new THREE.PointLight(0xffffff, 1);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x4ecdc4, 0.5);
        pointLight2.position.set(-10, -10, 10);
        scene.add(pointLight2);

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 旋转所有几何体
            scene.children.forEach((child) => {
                if (child instanceof THREE.Mesh) {
                    child.rotation.x += 0.005;
                    child.rotation.y += 0.005;
                }
            });
            
            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
