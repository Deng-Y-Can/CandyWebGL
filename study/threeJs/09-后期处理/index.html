<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09-后期处理 - Three.js学习教程</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        .info { position: fixed; top: 10px; left: 10px; color: white; font-family: Arial; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="info">
        <h3>后期处理效果</h3>
        <p>EffectComposer + UnrealBloomPass + FXAAShader</p>
        <p>鼠标左键拖拽旋转视角</p>
        <p>滚轮缩放</p>
    </div>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js';
        import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/shaders/FXAAShader.js';

        // 创建场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        // 创建相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        document.body.appendChild(renderer.domElement);

        // 创建轨道控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 创建几何体数组
        const colors = [0x00ff88, 0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa855f7];
        const geometryTypes = [
            () => new THREE.BoxGeometry(1.5, 1.5, 1.5),
            () => new THREE.SphereGeometry(1.2, 32, 32),
            () => new THREE.TorusGeometry(1, 0.3, 16, 100),
            () => new THREE.ConeGeometry(1, 2, 32),
            () => new THREE.IcosahedronGeometry(1.2)
        ];

        const positions = [
            [-4, 0, 0],
            [0, 2, 0],
            [4, 0, 0],
            [-2, -2, 0],
            [2, -2, 0]
        ];

        // 创建发光材质的物体
        positions.forEach((pos, index) => {
            const geometry = geometryTypes[index]();
            const material = new THREE.MeshStandardMaterial({
                color: colors[index],
                roughness: 0.1,
                metalness: 0.8,
                emissive: colors[index],
                emissiveIntensity: 0.3
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(...pos);
            scene.add(mesh);
        });

        // 添加环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        // 添加主光源
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // 添加彩色点光源（用于增强发光效果）
        const pointLight1 = new THREE.PointLight(0x00ff88, 1, 20);
        pointLight1.position.set(-4, 2, 3);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff6b6b, 1, 20);
        pointLight2.position.set(4, 2, 3);
        scene.add(pointLight2);

        const pointLight3 = new THREE.PointLight(0x4ecdc4, 1, 20);
        pointLight3.position.set(0, -2, 3);
        scene.add(pointLight3);

        // 创建后期处理合成器
        const composer = new EffectComposer(renderer);
        
        // 添加渲染通道
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // 添加UnrealBloomPass发光效果
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,    // 强度
            0.4,    // 半径
            0.85    // 阈值
        );
        composer.addPass(bloomPass);

        // 添加FXAA抗锯齿
        const fxaaPass = new ShaderPass(FXAAShader);
        fxaaPass.material.uniforms.resolution.value.set(
            1 / window.innerWidth,
            1 / window.innerHeight
        );
        composer.addPass(fxaaPass);

        // 动画状态
        let time = 0;

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            
            controls.update();
            
            // 旋转所有几何体
            scene.children.forEach((child) => {
                if (child instanceof THREE.Mesh) {
                    child.rotation.x += 0.005;
                    child.rotation.y += 0.005;
                }
            });
            
            // 动态调整发光强度
            bloomPass.strength = 1.5 + Math.sin(time) * 0.5;
            
            // 使用composer渲染
            composer.render();
        }
        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            fxaaPass.material.uniforms.resolution.value.set(
                1 / window.innerWidth,
                1 / window.innerHeight
            );
        });
    </script>
</body>
</html>
