<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-光照系统 - Three.js学习教程</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        .info { position: fixed; top: 10px; left: 10px; color: white; font-family: Arial; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="info">
        <h3>光照类型展示</h3>
        <p>AmbientLight - 环境光（蓝色区域）</p>
        <p>DirectionalLight - 方向光（黄色区域）</p>
        <p>PointLight - 点光源（红色球体）</p>
        <p>SpotLight - 聚光灯（紫色锥形）</p>
    </div>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';

        // 创建场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 创建相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 12);

        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 创建地面平面
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a4a,
            roughness: 0.8,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -3;
        scene.add(ground);

        // 创建各种几何体用于展示光照效果
        const geometries = [
            // 立方体 - 环境光区域
            { geo: new THREE.BoxGeometry(2, 2, 2), pos: [-6, -2, -4], color: 0x4ecdc4 },
            // 球体 - 方向光区域
            { geo: new THREE.SphereGeometry(1.5, 32, 32), pos: [0, -2, -4], color: 0xffe66d },
            // 圆环 - 点光源区域
            { geo: new THREE.TorusGeometry(1.2, 0.4, 16, 100), pos: [6, -2, -4], color: 0xff6b6b },
            // 圆柱体 - 聚光灯区域
            { geo: new THREE.CylinderGeometry(1, 1, 3, 32), pos: [0, -0.5, 4], color: 0xa855f7 }
        ];

        geometries.forEach((item) => {
            const material = new THREE.MeshStandardMaterial({
                color: item.color,
                roughness: 0.4,
                metalness: 0.2
            });
            const mesh = new THREE.Mesh(item.geo, material);
            mesh.position.set(...item.pos);
            scene.add(mesh);
        });

        // 1. AmbientLight - 环境光
        const ambientLight = new THREE.AmbientLight(0x4ecdc4, 0.4);
        scene.add(ambientLight);

        // 2. DirectionalLight - 方向光
        const directionalLight = new THREE.DirectionalLight(0xffe66d, 1);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        // 添加方向光助手
        const dirLightHelper = new THREE.DirectionalLightHelper(directionalLight, 2);
        scene.add(dirLightHelper);

        // 3. PointLight - 点光源
        const pointLight = new THREE.PointLight(0xff6b6b, 1, 30);
        pointLight.position.set(6, 3, -4);
        scene.add(pointLight);

        // 添加点光源球体（可视化）
        const pointLightSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xff6b6b })
        );
        pointLightSphere.position.copy(pointLight.position);
        scene.add(pointLightSphere);

        // 4. SpotLight - 聚光灯
        const spotLight = new THREE.SpotLight(0xa855f7, 1, 30, Math.PI / 6);
        spotLight.position.set(0, 8, 0);
        spotLight.target.position.set(0, -3, 4);
        scene.add(spotLight);
        scene.add(spotLight.target);

        // 添加聚光灯助手
        const spotLightHelper = new THREE.SpotLightHelper(spotLight);
        scene.add(spotLightHelper);

        // 动画循环
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            
            // 点光源动画
            pointLight.position.y = 3 + Math.sin(time) * 2;
            
            // 聚光灯动画
            spotLight.position.x = Math.sin(time) * 5;
            spotLight.target.position.x = Math.sin(time) * 5;
            
            // 更新助手
            spotLightHelper.update();
            
            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
